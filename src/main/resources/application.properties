# 密钥环本地持久化文件路径
keyring.storage-path=./data/keyring.json
# 管理操作令牌（本地开发默认值，生产请用环境变量覆盖）
keyring.admin-token=${KEYRING_ADMIN_TOKEN:local-dev-admin-token}
# 是否允许停用最后一个活跃密钥
keyring.allow-disable-last-active=false
# 根口令：包裹主密钥材料后落盘；未配置（空）时拒绝启动，绝不退化为明文
keyring.root-key=${KEYRING_ROOT_KEY:}
# 迁移请求记录持久化文件路径
keyring.migration-records-path=./data/migration-records.json
# 迁移请求记录上限，超出后按 FIFO 淘汰最旧记录
keyring.migration-max-records=10000
