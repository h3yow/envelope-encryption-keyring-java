# ===== 信封加密密钥环（EEKR）配置 =====
# 本地持久化目录：密钥环文件 keyring.json 与幂等记录目录 rewraps/ 均位于此
eekr.data-dir=${user.home}/.eekr
# 根密钥口令：仅本地开发用途；根密钥经 PBKDF2 派生后用于包裹主密钥材料，口令不落盘
eekr.root-key-passphrase=local-dev-passphrase-change-me
# PBKDF2 迭代次数
eekr.kdf-iterations=120000
# 访问令牌：管理令牌可执行轮换/启停，普通令牌只能加解密与重包裹
eekr.admin-token=admin-token-dev
eekr.user-token=user-token-dev
# 幂等记录保留上限（防无界增长）
eekr.idempotency.max-records=10000
