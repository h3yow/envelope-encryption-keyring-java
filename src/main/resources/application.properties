# 密钥环本地持久化文件路径
keyring.storage-path=./data/keyring.json
# 管理操作令牌（本地开发默认值，生产请用环境变量覆盖）
keyring.admin-token=${KEYRING_ADMIN_TOKEN:local-dev-admin-token}
# 是否允许停用最后一个活跃密钥
keyring.allow-disable-last-active=false
# 密钥环落盘保护根口令（必须显式配置，通常用环境变量 KEYRING_ROOT_PASSWORD 注入；缺失时拒绝启动）
keyring.root-password=${KEYRING_ROOT_PASSWORD:}
# 是否强制要求根口令（true 时未配置根口令拒绝启动，绝不退化成明文落盘）
keyring.require-root-password=true
# 迁移幂等记录持久化文件路径（留空则使用密钥环同目录下 migration-requests.json）
keyring.migration-store-path=
# 迁移幂等记录上限；超过后按“最久未重放”确定性淘汰
keyring.migration-max-records=1000
